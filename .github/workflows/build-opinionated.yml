name: Build Bazzite Tuxedo Images (for myself)
on:
  schedule:
    - cron:
        "20 06 * * *" # build at 06:20 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    branches:
      - main
    paths: # don't rebuild if only documentation have changed
      - ".github/workflows/build-opinionated.yml"
      - "recipes/opinionated/**"
      - "files/**"

      

  workflow_dispatch: # allow manually triggering builds

concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  recipes:
    name: create-recipe-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.find-recipes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: find-recipes
        run: |
          # Use 'opinionated/%P\n' so the output path is relative to 'recipes/'
          matrix=$(find recipes/opinionated -maxdepth 3 -type f \( -name '*.yml' -o -name '*.yaml' \) \
            ! -name 'recipe-example.yml' \
            ! -empty \
            -printf 'opinionated/%P\n' | sort -u | jq -R -s -c '
              split("\n")
              | map(gsub("\r"; ""))
              | map(select(length > 0))
              | {recipe: .}
            ')

          count=$(echo "$matrix" | jq '.recipe | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::No opinionated recipes found under recipes/opinionated/!"
            exit 1
          fi

          echo "Found $count recipe(s): $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  bluebuild:
    needs: recipes
    name: bluebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      # use the matrix output from the previous job to build all recipes in parallel
      matrix: ${{ fromJSON(needs.recipes.outputs.matrix) }}
    steps:
      # the build is fully handled by the reusable github action
      - name: steps
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          # we are disabling it because don't want to build the image on every PR
          pr_event_number: "" #${{ github.event.number }} 
          # enabled by default, disable if your image is small and you want faster builds
          # devnote: we are creating a nvidia bloated distro images, we of course want to maximize build space
          maximize_build_space: true
  
  build-success:
    name: build-success
    if: always()
    needs:
      - recipes
      - bluebuild
    runs-on: ubuntu-latest
    steps:
      - name: Verify build result
        env:
          RECIPES_RESULT: ${{ needs.recipes.result }}
          BLUEBUILD_RESULT: ${{ needs.bluebuild.result }}
        run: |
          test "$RECIPES_RESULT" = "success"
          test "$BLUEBUILD_RESULT" = "success"
