name: Build Bazzite Tuxedo Images (for myself)
on:
  schedule:
    - cron: "41 15 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-opinionated.yml"
      - "recipes/opinionated/**"
      - "files/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-opinionated.yml"
      - "recipes/opinionated/**"
      - "files/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  recipes:
    # Sadece PR dışındaki olaylarda VEYA PR'ı açan Dependabot ise çalışır
    if: github.event_name != 'pull_request' || github.actor == 'dependabot[bot]'
    name: create-recipe-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.find-recipes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: find-recipes
        run: |
          matrix=$(find recipes/opinionated -maxdepth 3 -type f \( -name '*.yml' -o -name '*.yaml' \) \
            ! -name 'recipe-example.yml' \
            ! -empty \
            -printf 'opinionated/%P\n' | sort -u | jq -R -s -c '
              split("\n")
              | map(gsub("\r"; ""))
              | map(select(length > 0))
              | {recipe: .}
            ')

          count=$(echo "$matrix" | jq '.recipe | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::No opinionated recipes found under recipes/opinionated/!"
            exit 1
          fi

          echo "Found $count recipe(s): $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  bluebuild:
    needs: recipes
    name: bluebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.recipes.outputs.matrix) }}
    steps:
      - name: steps
        uses: blue-build/github-action@v1.14
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true

  build-success:
    name: build-success
    if: always() && (github.event_name != 'pull_request' || github.actor == 'dependabot[bot]')
    needs:
      - recipes
      - bluebuild
    runs-on: ubuntu-latest
    steps:
      - name: Verify build result
        env:
          RECIPES_RESULT: ${{ needs.recipes.result }}
          BLUEBUILD_RESULT: ${{ needs.bluebuild.result }}
        run: |
          test "$RECIPES_RESULT" = "success"
          test "$BLUEBUILD_RESULT" = "success"