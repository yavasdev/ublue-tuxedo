---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bazzite-dx-nvidia-gnome-yavasdev
description: Bazzite DX Nvidia Gnome with Tuxedo drivers and Control Center and some custom settings.
# basically I added tuxedo drivers like others do but also fixed the lutris
# with uninstalling system lutris and adding flatpak lutris to system scope.
# this is my custom image for my personal use, I add and remove stuff, Im not responsible of anything changes here. 

alt-tags:
  - stable

base-image: ghcr.io/ublue-os/bazzite-dx-nvidia-gnome
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  # custom package removal
  - type: rpm-ostree
    remove:
      # remove broken system lutris
      - lutris
    
  # uncomment if you want to add flatpak lutris
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - net.lutris.Lutris

  # uncomment if you want to add lutris flatpak path
  - type: files
    files:
      - source: opinionated/system/usr/bin/lutris
        destination: /usr/bin/lutris

  # build requirements
  - type: dnf
    install:
      packages:
        - git
        - make
        - gcc
        - kmod
        - curl
        - wget
        - cpio
        - kernel-devel-matched

  # adding tccd system files to our image
  - type: script
    scripts:
      - build-tuxedo.sh

  # enabling the tccd service
  - type: systemd
    system:
      enabled:
        - tccd.service

  # installing my custom programs after the tccd part is done.
  - type: dnf
    repos:
    copr:
        - name: techtoboggan/claude-desktop-hardened
          chroot: fedora-44-x86_64
      files:
        - vscode.repo
    install:
      packages:
        - micro
        - igt-gpu-tools
        - code # latest vscode
        - claude-desktop-hardened # rpm repo for claude desktop that created from "techtoboggan/claude-desktop-hardened"

  # regenerating initframfs
  - type: initramfs

  # signing the image
  - type: signing
