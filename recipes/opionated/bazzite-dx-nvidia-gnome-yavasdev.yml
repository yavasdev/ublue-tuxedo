---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bazzite-dx-nvidia-gnome-yavasdev
description: Bazzite DX Nvidia Gnome with Tuxedo drivers and Control Center and some custom settings.

alt-tags:
  - stable

base-image: ghcr.io/ublue-os/bazzite-dx-nvidia-gnome
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  # custom package removal
  - type: rpm-ostree
    remove:
      # remove broken system lutris
      - lutris
    
  # add flatpak lutris
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - net.lutris.Lutris

  - type: dnf
    install:
      packages:
        - git
        - make
        - gcc
        - kmod
        - curl
        - wget
        - cpio
        - kernel-devel

  - type: script
    scripts:
      - build-tuxedo.sh

  - type: systemd
    system:
      enabled:
        - tccd.service

  - type: signing
